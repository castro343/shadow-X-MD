name: Render Keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Render web service
        run: |
          curl --fail --silent --show-error \
            --retry 2 --retry-delay 5 --retry-all-errors \
            --max-time 45 \
            https://shadow-x-md-b6ya.onrender.com/
